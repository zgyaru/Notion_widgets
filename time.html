<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们的时间</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 4px;
  }
  /* 始终左右并排：手机和电脑高度一致，Notion 嵌入块一个高度就够 */
  #lc {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
  }
  .card {
    flex: 1 1 0;
    min-width: 0;
    border-radius: 14px;
    padding: 10px 12px;
    background: #fdf0f3;
    color: #5a3a44;
    overflow: hidden;
  }
  .card.him { background: #eef3fb; color: #34465e; }
  .who {
    font-size: 12px;
    opacity: .85;
    height: 24px;
    display: flex;
    align-items: center;
    white-space: nowrap;
    overflow: hidden;
  }
  select {
    font: inherit;
    border: none;
    background: rgba(255,255,255,.85);
    border-radius: 7px;
    padding: 2px 4px;
    color: inherit;
    outline: none;
    max-width: 100%;
  }
  .t {
    font-size: clamp(24px, 8vw, 34px);
    font-weight: 600;
    letter-spacing: .5px;
    line-height: 1.15;
    margin: 4px 0 2px;
    font-variant-numeric: tabular-nums;
  }
  .d, .p {
    font-size: 11.5px;
    opacity: .75;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div id="lc">
  <div class="card">
    <div class="who">zyr 🇬🇧 英国</div>
    <div class="t" id="me-t">--:--</div>
    <div class="d" id="me-d"></div>
    <div class="p" id="me-p"></div>
  </div>
  <div class="card him">
    <div class="who">
      <select id="where" aria-label="他所在的城市">
        <option value="Asia/Singapore">wzm 🇸🇬 新加坡</option>
        <option value="Asia/Shanghai">wzm 🇨🇳 中国</option>
        <option value="Europe/Bucharest">wzm 🇷🇴 罗马尼亚</option>
      </select>
    </div>
    <div class="t" id="him-t">--:--</div>
    <div class="d" id="him-d"></div>
    <div class="p" id="him-p"></div>
  </div>
</div>
<script>
(function () {
  var sel = document.getElementById('where');
  try { var s = localStorage.getItem('lc-where'); if (s) sel.value = s; } catch (e) {}
  sel.onchange = function () { try { localStorage.setItem('lc-where', sel.value); } catch (e) {} tick(); };

  function parts(tz, now) {
    var t = new Intl.DateTimeFormat('zh-CN', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false }).format(now);
    var d = new Intl.DateTimeFormat('zh-CN', { timeZone: tz, month: 'numeric', day: 'numeric', weekday: 'short' }).format(now);
    var h = parseInt(new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', hour12: false }).format(now), 10) % 24;
    return { t: t, d: d, h: h };
  }
  function period(h) {
    if (h >= 6 && h < 12) return '🌤 早上';
    if (h >= 12 && h < 18) return '☀️ 下午';
    if (h >= 18 && h < 23) return '🌆 晚上';
    return '🌙 夜里';
  }
  function offset(tz, now) {
    var p = new Intl.DateTimeFormat('en-US', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(now);
    var o = {}; p.forEach(function (x) { o[x.type] = x.value; });
    return (Date.UTC(+o.year, +o.month - 1, +o.day, (+o.hour) % 24, +o.minute) - Math.floor(now.getTime() / 60000) * 60000) / 3600000;
  }
  function set(id, v) { document.getElementById(id).textContent = v; }

  function tick() {
    var now = new Date(), tz = sel.value;
    var a = parts('Europe/London', now), b = parts(tz, now);
    var df = Math.round(offset(tz, now) - offset('Europe/London', now));
    set('me-t', a.t); set('me-d', a.d); set('me-p', period(a.h));
    set('him-t', b.t); set('him-d', b.d);
    set('him-p', period(b.h) + (df === 0 ? ' · 同一时间' : df > 0 ? ' · 快' + df + '小时' : ' · 慢' + (-df) + '小时'));
  }
  tick();
  setInterval(tick, 15000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });
})();
</script>
</body>
</html>
